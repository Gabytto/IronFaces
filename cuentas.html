<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>L2 Iron-Faces</title>
</head>
<body>
    <header class="header">
        <a href="./" class="logo"><img src="./img/if_logo.jpeg" alt="Logo Ironfaces" class="logo"></a>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="./info.html" class="nav__link">Características</a></li>
                <li class="nav__item"><a href="./descargas.html" class="nav__link">Descargas</a></li>
                <li class="nav__item"><a href="./donaciones.html" class="nav__link">Donaciones</a></li>
                <li class="nav__item"><a href="./cuentas.html" class="nav__link">Cuentas</a></li>
            </ul>
    </header>
    <main>
        <div class="box__principal">
            <div class="box__grande">
                <div class="box__chico"><h1>Panel de cuentas</h1></div>
                <div class="box__chico"><h1>Servidor de Lineage 2 Interlude</h1></div>
            </div>
            <div class="box__grande" id="formulario">
                <h1 class="box__chico">Crear cuenta</h1>
                <div class="box__chico">
                    <label for="name">Nombre de la cuenta: </label>
                    <input type="text" id="name">
                    <label for="pass">Contraseña: </label>
                    <input type="password" id="pass">
                    <label for="email">E-mail: </label>
                    <input type="mail" id="email">
                    <input type="submit" name="enviar" id="enviar">
                </div>
            </div>
            <div class="box__grande" id="formulario">
                <h1 class="box__chico">Recuperar contraseña</h1>
                <div class="box__chico">
                    <label for="name">Nombre de la cuenta: </label>
                    <input type="text" id="name">
                    <label for="pass">Contraseña: </label>
                    <input type="password" id="pass">
                    <label for="email">E-mail: </label>
                    <input type="mail" id="email">
                    <input type="submit" name="enviar" id="enviar">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
