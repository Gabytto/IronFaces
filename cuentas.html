<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>L2 Iron-Faces</title>
</head>
<body>
    <header class="header">
        <a href="./" class="logo"><img src="./img/if_logo.jpeg" alt="Logo Ironfaces" class="logo"></a>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="./info.html" class="nav__link">Características</a></li>
                <li class="nav__item"><a href="./descargas.html" class="nav__link">Descargas</a></li>
                <li class="nav__item"><a href="./donaciones.html" class="nav__link">Donaciones</a></li>
                <li class="nav__item"><a href="./cuentas.html" class="nav__link">Cuentas</a></li>
            </ul>
    </header>
    <main>
    <div class="box__principal" id="box__cuentas">
        <!-- Bloque Superior: Encabezados -->
        <div class="box__grande">
            <div class="box__chico"><h1>Panel de cuentas</h1></div>
            <div class="box__chico"><h1>Servidor de Lineage 2 Interlude</h1></div>
        </div>

        <!-- Bloque Inferior: Formularios Lado a Lado -->
        <div class="box__grande">
            <!-- Columna Izquierda: Crear Cuenta -->
            <div class="box__chico">
                <h2>Crear cuenta</h2>
                <form class="formulario">
                    <label for="create-name">Nombre de la cuenta:</label>
                    <input type="text" id="create-name">

                    <label for="create-pass">Contraseña:</label>
                    <input type="password" id="create-pass">

                    <label for="create-email">E-mail:</label>
                    <input type="email" id="create-email">

                    <input type="submit" value="Enviar" class="btn-submit">
                </form>
            </div>

            <!-- Columna Derecha: Recuperar Contraseña -->
            <div class="box__chico">
                <h2>Recuperar contraseña</h2>
                <form class="formulario">
                    <label for="recover-name">Nombre de la cuenta:</label>
                    <input type="text" id="recover-name">

                    <label for="recover-pass">Contraseña:</label>
                    <input type="password" id="recover-pass">

                    <label for="recover-email">E-mail:</label>
                    <input type="email" id="recover-email">

                    <input type="submit" value="Enviar" class="btn-submit">
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
